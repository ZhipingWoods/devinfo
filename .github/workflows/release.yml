name: release

# tools/package.sh builds these from dist/ - they are verified by hand on the
# machines they target, so this workflow only publishes them. The naming is
# devinfo-<version>-<os>-<arch>.<ext>; archive contents are identical to the
# repositories devinfo CLI plus its C ABI library.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail the run if a package is missing rather than publishing a release
      # with holes in it.
      - name: Check the packages
        run: |
          set -e
          for f in \
            release/devinfo-1.0.0-windows-x64.zip \
            release/devinfo-1.0.0-windows-x86.zip \
            release/devinfo-1.0.0-macos-universal.dmg \
            release/devinfo-1.0.0-macos-universal.zip \
            release/devinfo-1.0.0-linux-x86_64.tar.gz \
            release/devinfo-1.0.0-linux-aarch64.tar.gz
          do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          ls -l release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: devinfo $$ github.ref_name
          generate_release_notes: true
          body: |
            Prebuilt binaries, one per platform. No compiler, no runtime, no
            dependencies: unpack, run, read the machine.

            | Platform | Architecture | File |
            |---|---|---|
            | Windows 10/11 | x86_64 | devinfo-1.0.0-windows-x64.zip |
            | Windows 10/11 | i686, 32-bit | devinfo-1.0.0-windows-x86.zip |
            | Windows 7+ | i686, 32-bit | devinfo-1.0.0-windows-x86.zip |
            | macOS 11+ | universal: arm64 + x86_64 | devinfo-1.0.0-macos-universal.dmg |
            | macOS 11+ | universal: arm64 + x86_64 | devinfo-1.0.0-macos-universal.zip |
            | Linux | x86_64 | devinfo-1.0.0-linux-x86_64.tar.gz |
            | Linux | aarch64 (Jetson, Graviton, Kunpeng) | devinfo-1.0.0-linux-aarch64.tar.gz |

            Every archive contains the @@T@@devinfo@@T@@ executable, its C ABI library
            (@@T@@libdevinfo.dylib@@T@@ / @@T@@libdevinfo.so@@T@@ / @@T@@devinfo.dll@@T@@), and a short README.

            The macOS build is one universal binary: it runs natively on Apple
            Silicon and on Intel without Rosetta for the x86 slice, and under
            Rosetta when the host is Apple Silicon.

            Anything shown with a leading tilde is derived from a chip spec
            table and marked in the JSON's @@T@@estimated@@T@@ array - never a datasheet
            number passed off as measured.
          files: |
            release/devinfo-1.0.0-windows-x64.zip
            release/devinfo-1.0.0-windows-x86.zip
            release/devinfo-1.0.0-macos-universal.dmg
            release/devinfo-1.0.0-macos-universal.zip
            release/devinfo-1.0.0-linux-x86_64.tar.gz
            release/devinfo-1.0.0-linux-aarch64.tar.gz
