name: release

# The binaries in dist/ are built and verified by hand on the machines they
# target. This attaches them to the release so they are one click away
# instead of buried five directories deep in the tree.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two of the artifacts are both called "devinfo" (the macOS and the
      # Linux CLI), and release assets must have unique names, so they are
      # staged under platform-qualified names first. This also fails the run
      # if any artifact is missing, rather than publishing a release with
      # holes in it.
      - name: Stage the artifacts
        run: |
          set -e
          mkdir -p out
          stage() { if [ ! -f "$1" ]; then echo "missing: $1"; exit 1; fi; cp "$1" "out/$2"; }
          stage dist/windows/devinfo-x64.exe     devinfo-windows-x64.exe
          stage dist/windows/devinfo-x86.exe     devinfo-windows-x86.exe
          stage dist/windows/devinfo-x64.dll     libdevinfo-windows-x64.dll
          stage dist/macos/devinfo               devinfo-macos-universal
          stage dist/macos/libdevinfo.dylib      libdevinfo-macos.dylib
          stage dist/linux/devinfo               devinfo-linux-x64
          stage dist/linux/devinfo-arm64         devinfo-linux-arm64
          stage dist/linux/libdevinfo.so         libdevinfo-linux-x64.so
          stage dist/linux/libdevinfo-arm64.so   libdevinfo-linux-arm64.so
          stage dist/devinfo-test.zip            devinfo-test.zip
          stage dist/devinfo-test-mac.zip        devinfo-test-mac.zip
          ls -l out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: devinfo ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Prebuilt binaries. No compiler and no dependencies: copy one file to
            the machine and run it.

            | Platform | File | Kind |
            |---|---|---|
            | Windows x64 | devinfo-windows-x64.exe | single-file CLI |
            | Windows x86 | devinfo-windows-x86.exe | single-file CLI (32-bit) |
            | Windows x64 | libdevinfo-windows-x64.dll | C ABI plugin |
            | macOS | devinfo-macos-universal | universal CLI (arm64 + x86_64) |
            | macOS | libdevinfo-macos.dylib | C ABI plugin |
            | Linux x64 | devinfo-linux-x64 | single-file CLI |
            | Linux arm64 | devinfo-linux-arm64 | single-file CLI |
            | Linux x64 | libdevinfo-linux-x64.so | C ABI plugin |
            | Linux arm64 | libdevinfo-linux-arm64.so | C ABI plugin |

            devinfo-test.zip and devinfo-test-mac.zip are the same files with a
            short README inside.

            Anything shown with a tilde is an estimate, never a datasheet copy:
            see the "no invented numbers" section of the README.
          files: out/*
